<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Map</title>
<style>
    :root {
        --bg: #000000;
        --fg: #ffffff;
        --pill: #000000aa;
        --accent: #2f6fb0;
    }
    html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        font-family: system-ui, sans-serif;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }
    #status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--pill);
        font-size: 14px;
    }
    #fit {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--pill);
        color: var(--fg);
        font-size: 14px;
    }
    #who {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--pill);
        color: var(--fg);
        font-size: 14px;
        display: none;
    }
    #join {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--bg);
    }
    #join form {
        display: flex;
        gap: 8px;
        padding: 0 16px;
    }
    #join input, #join button {
        font-size: 18px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 0;
    }
    #join button {
        background: var(--accent);
        color: var(--fg);
    }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status">Connecting</div>
<button id="fit" type="button">Fit</button>
<button id="who" type="button"></button>
<div id="join">
    <form id="join-form">
        <input id="join-name" placeholder="Your token name" autocomplete="off">
        <button type="submit">Join</button>
    </form>
</div>
<script>
    const RELAY = "wss://vtt-relay.slopverse.workers.dev";
    const NAME_SIZE = 28;
    const OVERLAY_FADE = 0.75;
    const RULER_THICK = 10;
    const RULER_TEXT = 28;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 6;
    const PROP_COLORS = ["#6b4f8a", "#4f7a8a", "#8a5f4f", "#4f8a62", "#8a4f6b", "#7a7a4f"];

    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const DEFAULT_ROOM = "slopverse-test";
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || DEFAULT_ROOM;
    const joinEl = document.getElementById("join");
    const nameInput = document.getElementById("join-name");
    const whoEl = document.getElementById("who");
    let myName = "";

    function loadName() {
        const fromUrl = (params.get("name") || "").trim();
        if (fromUrl) {
            return fromUrl;
        }
        try {
            return (localStorage.getItem("tokenName") || "").trim();
        } catch (error) {
            return "";
        }
    }

    function saveName(name) {
        try {
            localStorage.setItem("tokenName", name);
        } catch (error) {
        }
    }

    function myIds() {
        const ids = new Set();
        if (state) {
            for (const tok of state.tokens) {
                if (tok.player && sameName(tok.name)) {
                    ids.add(tok.id);
                }
            }
        }
        return ids;
    }

    function seenBy(list, mine) {
        return !!list && list.some((id) => mine.has(id));
    }

    function shownAlpha(entry, mine) {
        if (seenBy(entry.rv, mine)) {
            return 1;
        }
        return entry.alpha === undefined ? 1 : entry.alpha;
    }

    function sameName(name) {
        return !!myName && (name || "").trim().toLowerCase() === myName.toLowerCase();
    }

    function setName(name) {
        myName = name;
        whoEl.textContent = "Playing as " + name;
        whoEl.style.display = "block";
        joinEl.style.display = "none";
    }

    ctx.imageSmoothingQuality = "high";

    let state = null;
    let textures = {};
    let socket = null;
    let retry = 0;
    let pingTimer = null;
    let view = { scale: 1, ox: 0, oy: 0 };
    let cam = { zoom: 1, px: 0, py: 0 };
    let drag = null;
    let pan = null;
    let pinch = null;
    const pointers = new Map();
    let optimistic = null;

    function setStatus(text) {
        statusEl.textContent = text;
    }

    function hpColor(hp, max) {
        if (hp >= max) {
            return "#3fb950";
        }
        const pct = hp * 100 / max;
        if (pct > 75) {
            return "#9acd32";
        }
        if (pct > 50) {
            return "#e6d229";
        }
        if (pct > 25) {
            return "#f08c1e";
        }
        return "#d93a3a";
    }

    function hashColor(text) {
        let sum = 0;
        for (const ch of text) {
            sum += ch.charCodeAt(0);
        }
        return PROP_COLORS[sum % PROP_COLORS.length];
    }

    function outlinedText(text, x, y, size, baseline) {
        ctx.font = "bold " + size + "px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = baseline;
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(2, size / 7);
        ctx.strokeStyle = "#000000";
        ctx.strokeText(text, x, y);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, x, y);
    }

    function drawRuler(ruler) {
        ctx.globalAlpha = 1;
        let mx = (ruler.x1 + ruler.x2) / 2;
        let my = (ruler.y1 + ruler.y2) / 2;
        let lift = 0;
        if (ruler.k === "sphere") {
            const radius = Math.hypot(ruler.x2 - ruler.x1, ruler.y2 - ruler.y1);
            ctx.fillStyle = ruler.c + "80";
            ctx.beginPath();
            ctx.arc(ruler.x1, ruler.y1, radius, 0, Math.PI * 2);
            ctx.fill();
            mx = ruler.x1;
            my = ruler.y1;
            lift = 12 / view.scale;
        } else {
            const length = Math.hypot(ruler.x2 - ruler.x1, ruler.y2 - ruler.y1);
            if (length > 0) {
                ctx.save();
                ctx.translate(mx, my);
                ctx.rotate(Math.atan2(ruler.y2 - ruler.y1, ruler.x2 - ruler.x1));
                ctx.fillStyle = ruler.c;
                ctx.fillRect(-length / 2, -RULER_THICK / 2, length, RULER_THICK);
                ctx.restore();
            }
        }
        outlinedText(ruler.ft + " ft", mx, my - lift, RULER_TEXT, "middle");
    }

    function placed(tok) {
        if (drag && drag.id === tok.id) {
            return Object.assign({}, tok, { cx: drag.x, cy: drag.y });
        }
        if (optimistic && optimistic.id === tok.id && Date.now() < optimistic.expires) {
            return Object.assign({}, tok, { cx: optimistic.cx, cy: optimistic.cy });
        }
        return tok;
    }

    function variant(tex, mode) {
        if (!tex[mode]) {
            const layer = document.createElement("canvas");
            layer.width = tex.img.naturalWidth;
            layer.height = tex.img.naturalHeight;
            const g = layer.getContext("2d");
            g.drawImage(tex.img, 0, 0);
            if (mode === "dim") {
                g.globalCompositeOperation = "source-atop";
                g.fillStyle = "rgba(0, 0, 0, 0.5)";
                g.fillRect(0, 0, layer.width, layer.height);
            } else {
                g.globalCompositeOperation = "saturation";
                g.fillStyle = "#808080";
                g.fillRect(0, 0, layer.width, layer.height);
                g.globalCompositeOperation = "destination-in";
                g.drawImage(tex.img, 0, 0);
            }
            tex[mode] = layer;
        }
        return tex[mode];
    }

    function paintCell(key, x, y, size, mode) {
        const tex = textures[key];
        if (tex) {
            ctx.drawImage(mode === "full" ? tex.img : variant(tex, mode), x, y, size, size);
            return;
        }
        ctx.fillStyle = key.charAt(0) === "#" ? key : (state.colors || {})[key] || "#2b2b2b";
        ctx.fillRect(x, y, size, size);
        if (mode === "dim") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(x, y, size, size);
        }
    }

    function shape(flat) {
        const path = new Path2D();
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        for (let i = 0; i < flat.length; i += 2) {
            if (i === 0) {
                path.moveTo(flat[i], flat[i + 1]);
            } else {
                path.lineTo(flat[i], flat[i + 1]);
            }
            minX = Math.min(minX, flat[i]);
            maxX = Math.max(maxX, flat[i]);
            minY = Math.min(minY, flat[i + 1]);
            maxY = Math.max(maxY, flat[i + 1]);
        }
        path.closePath();
        return { path: path, minX: minX, minY: minY, maxX: maxX, maxY: maxY };
    }

    function prepareFog(data) {
        if (!data.fog) {
            return;
        }
        data.fog.darks = data.fog.darks.map((dark) => ({ o: dark.o, sh: shape(dark.p) }));
        data.fog.devils = (data.fog.devils || []).map((devil) => ({ o: devil.o, sh: shape(devil.p) }));
        data.fog.lights = data.fog.lights.map((light) => ({ p: shape(light.p), b: light.b ? shape(light.b) : null, dim: light.dim, bright: light.bright }));
    }

    function paintIn(sh, paint) {
        const tile = state.tile;
        const c0 = Math.max(0, Math.floor(sh.minX / tile));
        const c1 = Math.min(state.cols - 1, Math.floor(sh.maxX / tile));
        const r0 = Math.max(0, Math.floor(sh.minY / tile));
        const r1 = Math.min(state.rows - 1, Math.floor(sh.maxY / tile));
        ctx.save();
        ctx.clip(sh.path);
        for (let row = r0; row <= r1; row++) {
            for (let col = c0; col <= c1; col++) {
                paint(col, row);
            }
        }
        ctx.restore();
    }

    function drawFog(size, mine) {
        const tile = state.tile;
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, state.cols * tile, state.rows * tile);
        for (const dark of state.fog.darks) {
            if (!mine.has(dark.o)) {
                continue;
            }
            paintIn(dark.sh, (col, row) => {
                paintCell(state.tiles[row][col], col * tile, row * tile, size, "gray");
                ctx.fillStyle = "rgba(255, 255, 255, 0.133)";
                ctx.fillRect(col * tile, row * tile, size, size);
            });
        }
        for (const devil of state.fog.devils) {
            paintIn(devil.sh, (col, row) => {
                paintCell(state.tiles[row][col], col * tile, row * tile, size, "full");
            });
        }
        for (const light of state.fog.lights) {
            paintIn(light.p, (col, row) => {
                paintCell(state.tiles[row][col], col * tile, row * tile, size, "full");
            });
        }
        const tint = (col, row) => {
            ctx.fillStyle = "rgba(255, 216, 58, 0.102)";
            ctx.fillRect(col * tile, row * tile, size, size);
        };
        for (const light of state.fog.lights) {
            if (light.dim) {
                paintIn(light.p, tint);
            }
            if (light.bright) {
                paintIn(light.b || light.p, tint);
            }
        }
    }

    function drawProp(prop) {
        const tex = textures[prop.key];
        if (tex) {
            const image = prop.mode && prop.mode !== "full" ? variant(tex, prop.mode) : tex.img;
            if (tex.fw) {
                const pz = Math.min(prop.w / tex.fw, prop.h / tex.fh);
                const dw = tex.tw * pz;
                const dh = tex.th * pz;
                ctx.drawImage(image, prop.cx - dw / 2, prop.cy - dh / 2, dw, dh);
            } else {
                ctx.drawImage(image, prop.cx - prop.w / 2, prop.cy - prop.h / 2, prop.w, prop.h);
            }
            return;
        }
        const x = prop.cx - prop.w / 2;
        const y = prop.cy - prop.h / 2;
        ctx.fillStyle = hashColor(prop.key);
        ctx.strokeStyle = "#000000aa";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(x, y, prop.w, prop.h, Math.min(prop.w, prop.h) * 0.15);
        ctx.fill();
        ctx.stroke();
        outlinedText(prop.key.replace("prop_", "").replace(/_\d+$/, ""), prop.cx, prop.cy, 20, "middle");
    }

    function drawToken(tok) {
        const r = tok.size / 2;
        const border = tok.size * 0.045;
        ctx.globalAlpha = tok.alpha === undefined ? 1 : tok.alpha;

        ctx.beginPath();
        ctx.arc(tok.cx, tok.cy, r, 0, Math.PI * 2);
        ctx.fillStyle = tok.fill;
        ctx.fill();

        const portrait = tok.img ? textures[tok.img] : null;
        if (portrait) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(tok.cx, tok.cy, r, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(portrait.img, tok.cx - r, tok.cy - r, tok.size, tok.size);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(tok.cx, tok.cy, r - border / 2, 0, Math.PI * 2);
        ctx.lineWidth = border;
        ctx.strokeStyle = tok.color;
        ctx.stroke();

        if (!portrait) {
            outlinedText(tok.initial, tok.cx, tok.cy, tok.size * 0.55, "middle");
        }

        if (tok.name) {
            outlinedText(tok.name, tok.cx, tok.cy - r - 4, NAME_SIZE, "bottom");
        }

        if (tok.hp !== undefined) {
            const bh = Math.max(8, Math.floor(tok.size / 4));
            const bx = tok.cx - r;
            const by = tok.cy + r - bh;
            ctx.fillStyle = "#000000cc";
            ctx.fillRect(bx, by, tok.size, bh);
            const w = tok.size * Math.max(0, Math.min(1, tok.hp / tok.max_hp));
            if (w > 0) {
                ctx.fillStyle = hpColor(tok.hp, tok.max_hp);
                ctx.fillRect(bx, by, w, bh);
            }
            if (bh >= 16) {
                outlinedText(tok.hp_text || tok.hp + "/" + tok.max_hp, tok.cx, by + bh / 2, bh - 6, "middle");
            }
        }
        ctx.globalAlpha = 1;
    }

    function fitScale() {
        return Math.min(canvas.width / (state.cols * state.tile), canvas.height / (state.rows * state.tile));
    }

    function updateView() {
        const mapW = state.cols * state.tile;
        const mapH = state.rows * state.tile;
        const scale = fitScale() * cam.zoom;
        const limX = Math.max(0, (mapW * scale - canvas.width) / 2);
        const limY = Math.max(0, (mapH * scale - canvas.height) / 2);
        cam.px = Math.max(-limX, Math.min(limX, cam.px));
        cam.py = Math.max(-limY, Math.min(limY, cam.py));
        view = { scale: scale, ox: (canvas.width - mapW * scale) / 2 + cam.px, oy: (canvas.height - mapH * scale) / 2 + cam.py };
    }

    function zoomAt(x, y, zoom) {
        if (!state) {
            return;
        }
        const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
        const mx = (x - view.ox) / view.scale;
        const my = (y - view.oy) / view.scale;
        const scale = fitScale() * next;
        cam.zoom = next;
        cam.px = x - mx * scale - (canvas.width - state.cols * state.tile * scale) / 2;
        cam.py = y - my * scale - (canvas.height - state.rows * state.tile * scale) / 2;
    }

    function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!state) {
            return;
        }

        const tile = state.tile;
        const size = tile - state.gap;
        const mine = myIds();
        updateView();
        ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);

        for (let row = 0; row < state.rows; row++) {
            for (let col = 0; col < state.cols; col++) {
                paintCell(state.tiles[row][col], col * tile, row * tile, size, "full");
            }
        }

        if (state.fog) {
            drawFog(size, mine);
        }

        for (const [col, row, key, shade, owners] of state.walls) {
            const level = shade === 2 && !seenBy(owners, mine) ? 0 : shade;
            paintCell(key, col * tile, row * tile, size, state.fog ? ["dim", "full", "gray"][level] : "full");
        }

        function drawProps(overlay, tokenRects) {
            for (const prop of state.props) {
                if (!!prop.overlay !== overlay) {
                    continue;
                }
                let alpha = shownAlpha(prop, mine);
                if (alpha <= 0) {
                    continue;
                }
                if (overlay && tokenRects.some((t) => t.x < prop.cx + prop.w / 2 && prop.cx - prop.w / 2 < t.x + t.size && t.y < prop.cy + prop.h / 2 && prop.cy - prop.h / 2 < t.y + t.size)) {
                    alpha *= OVERLAY_FADE;
                }
                ctx.globalAlpha = alpha;
                drawProp(seenBy(prop.dk, mine) ? Object.assign({}, prop, { mode: "gray" }) : prop);
            }
            ctx.globalAlpha = 1;
        }

        drawProps(false, []);
        const tokenRects = [];

        let held = null;
        const rulers = state.rulers || [];
        let nextRuler = 0;
        for (let i = 0; i < state.tokens.length; i++) {
            const tok = state.tokens[i];
            while (nextRuler < rulers.length && rulers[nextRuler].at <= i) {
                drawRuler(rulers[nextRuler++]);
            }
            const alpha = shownAlpha(tok, mine);
            if (alpha <= 0) {
                continue;
            }
            const shown = Object.assign({}, placed(tok), { alpha: alpha });
            tokenRects.push({ x: shown.cx - shown.size / 2, y: shown.cy - shown.size / 2, size: shown.size });
            if (drag && drag.id === tok.id) {
                held = shown;
            } else {
                drawToken(shown);
            }
        }
        while (nextRuler < rulers.length) {
            drawRuler(rulers[nextRuler++]);
        }
        if (held) {
            drawToken(held);
        }
        drawProps(true, tokenRects);

        if (state.fog) {
            blackout(mine);
        }
    }

    let blackCanvas = null;

    function blackout(mine) {
        const own = state.fog.devils.filter((devil) => mine.has(devil.o));
        if (!own.length) {
            return;
        }
        if (!blackCanvas) {
            blackCanvas = document.createElement("canvas");
        }
        if (blackCanvas.width !== canvas.width || blackCanvas.height !== canvas.height) {
            blackCanvas.width = canvas.width;
            blackCanvas.height = canvas.height;
        }
        const bctx = blackCanvas.getContext("2d");
        bctx.setTransform(1, 0, 0, 1, 0, 0);
        bctx.globalCompositeOperation = "source-over";
        bctx.fillStyle = "#000000";
        bctx.fillRect(0, 0, blackCanvas.width, blackCanvas.height);
        bctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
        bctx.globalCompositeOperation = "destination-out";
        bctx.fillStyle = "#000000";
        for (const devil of own) {
            bctx.fill(devil.sh.path);
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(blackCanvas, 0, 0);
        ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    }

    function toCanvas(event) {
        const rect = canvas.getBoundingClientRect();
        const dpr = canvas.width / rect.width;
        return { x: (event.clientX - rect.left) * dpr, y: (event.clientY - rect.top) * dpr };
    }

    function spread() {
        const [a, b] = Array.from(pointers.values());
        return { dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function toMap(event) {
        const rect = canvas.getBoundingClientRect();
        const dpr = canvas.width / rect.width;
        return {
            x: ((event.clientX - rect.left) * dpr - view.ox) / view.scale,
            y: ((event.clientY - rect.top) * dpr - view.oy) / view.scale,
        };
    }

    function tokenAt(point) {
        if (!state) {
            return null;
        }
        for (let i = state.tokens.length - 1; i >= 0; i--) {
            const tok = state.tokens[i];
            const shown = placed(tok);
            const half = tok.size / 2;
            if (tok.player && sameName(tok.name) && Math.abs(point.x - shown.cx) <= half && Math.abs(point.y - shown.cy) <= half) {
                return tok;
            }
        }
        return null;
    }

    function snap(tok, point) {
        const tile = state.tile;
        const n = Math.max(1, Math.floor(tok.cells || 1));
        const col = Math.max(0, Math.min(state.cols - n, Math.floor((point.x - (n - 1) * tile / 2) / tile)));
        const row = Math.max(0, Math.min(state.rows - n, Math.floor((point.y - (n - 1) * tile / 2) / tile)));
        const slots = tok.slots || 1;
        if (slots > 1) {
            const area = tile - state.gap;
            const sx = Math.max(0, Math.min(slots - 1, Math.floor((point.x - col * tile) / area * slots)));
            const sy = Math.max(0, Math.min(slots - 1, Math.floor((point.y - row * tile) / area * slots)));
            return { col: col, row: row, sx: sx, sy: sy, cx: col * tile + (sx + 0.5) * area / slots, cy: row * tile + (sy + 0.5) * area / slots };
        }
        const off = tok.size < tile - state.gap ? (tile - state.gap - tok.size) / 2 : 0;
        return { col: col, row: row, cx: col * tile + off + tok.size / 2, cy: row * tile + off + tok.size / 2 };
    }

    function release(event) {
        if (!pointers.delete(event.pointerId)) {
            return;
        }
        pinch = null;
        pan = null;
        if (pointers.size === 1 && !drag) {
            pan = pointers.keys().next().value;
        }
    }

    function finishDrag() {
        if (!drag) {
            return;
        }
        const tok = state ? state.tokens.find((t) => t.id === drag.id) : null;
        const target = tok ? snap(tok, drag) : null;
        drag = null;
        canvas.style.cursor = "default";
        if (target && (Math.abs(target.cx - tok.cx) >= 1 || Math.abs(target.cy - tok.cy) >= 1) && socket && socket.readyState === 1) {
            const move = { type: "move", id: tok.id, col: target.col, row: target.row };
            if (target.sx !== undefined) {
                move.sx = target.sx;
                move.sy = target.sy;
            }
            socket.send(JSON.stringify(move));
            optimistic = { id: tok.id, cx: target.cx, cy: target.cy, expires: Date.now() + 2000 };
            setTimeout(draw, 2100);
        }
        draw();
    }

    canvas.addEventListener("pointerdown", (event) => {
        if (pointers.size >= 2) {
            return;
        }
        pointers.set(event.pointerId, toCanvas(event));
        canvas.setPointerCapture(event.pointerId);
        if (pointers.size === 2) {
            drag = null;
            pan = null;
            pinch = spread();
            canvas.style.cursor = "default";
            draw();
            return;
        }
        const point = toMap(event);
        const tok = tokenAt(point);
        if (!tok) {
            pan = event.pointerId;
            return;
        }
        drag = { id: tok.id, x: point.x, y: point.y };
        optimistic = null;
        canvas.style.cursor = "grabbing";
        draw();
    });

    canvas.addEventListener("pointermove", (event) => {
        const prev = pointers.get(event.pointerId);
        if (prev) {
            const now = toCanvas(event);
            pointers.set(event.pointerId, now);
            if (pinch && pointers.size === 2) {
                const next = spread();
                zoomAt(pinch.x, pinch.y, cam.zoom * next.dist / pinch.dist);
                cam.px += next.x - pinch.x;
                cam.py += next.y - pinch.y;
                pinch = next;
                draw();
                return;
            }
            if (pan === event.pointerId) {
                cam.px += now.x - prev.x;
                cam.py += now.y - prev.y;
                draw();
                return;
            }
        }
        const point = toMap(event);
        if (drag) {
            drag.x = Math.max(0, Math.min(state.cols * state.tile, point.x));
            drag.y = Math.max(0, Math.min(state.rows * state.tile, point.y));
            draw();
        } else {
            canvas.style.cursor = tokenAt(point) ? "grab" : "default";
        }
    });

    canvas.addEventListener("pointerup", (event) => {
        release(event);
        finishDrag();
    });

    canvas.addEventListener("pointercancel", (event) => {
        release(event);
        drag = null;
        canvas.style.cursor = "default";
        draw();
    });

    canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const point = toCanvas(event);
        const delta = event.deltaMode === 1 ? event.deltaY * 33 : event.deltaY;
        zoomAt(point.x, point.y, cam.zoom * Math.exp(-delta * (event.ctrlKey ? 0.01 : 0.0015)));
        draw();
    }, { passive: false });

    document.getElementById("fit").onclick = () => {
        cam = { zoom: 1, px: 0, py: 0 };
        draw();
    };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        draw();
    }

    function connect() {
        socket = new WebSocket(RELAY + "/ws/" + encodeURIComponent(room) + "?role=player");

        socket.onopen = () => {
            retry = 0;
            setStatus(state ? "Live" : "Waiting for the DM");
            pingTimer = setInterval(() => {
                if (socket.readyState === 1) {
                    socket.send("ping");
                }
            }, 25000);
        };

        socket.onmessage = (event) => {
            if (event.data === "pong") {
                return;
            }
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (error) {
                return;
            }
            if (data.type === "tex") {
                const img = new Image();
                img.onload = () => {
                    textures[data.key] = { img: img, fw: data.fw, fh: data.fh, tw: data.tw, th: data.th };
                    draw();
                };
                img.src = "data:image/png;base64," + data.png;
                return;
            }
            if (data.type === "state") {
                prepareFog(data);
                state = data;
                if (optimistic) {
                    const t = data.tokens.find((x) => x.id === optimistic.id);
                    if (!t || (Math.abs(t.cx - optimistic.cx) < 1 && Math.abs(t.cy - optimistic.cy) < 1)) {
                        optimistic = null;
                    }
                }
                setStatus("Live");
                draw();
            }
        };

        socket.onclose = () => {
            clearInterval(pingTimer);
            setStatus("Reconnecting");
            retry = Math.min(retry + 1, 6);
            setTimeout(connect, 500 * Math.pow(2, retry));
        };
    }

    window.addEventListener("resize", resize);
    resize();

    connect();

    document.getElementById("join-form").onsubmit = (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (name) {
            saveName(name);
            setName(name);
            draw();
        }
    };

    whoEl.onclick = () => {
        nameInput.value = myName;
        joinEl.style.display = "flex";
        nameInput.focus();
    };

    const startName = loadName();

    if (startName) {
        setName(startName);
    } else {
        joinEl.style.display = "flex";
    }
</script>
</body>
</html>
